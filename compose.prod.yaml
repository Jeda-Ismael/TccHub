# Produção (servidor). Uso:
#   docker compose -f compose.yaml -f compose.prod.yaml --env-file .env.prod up -d --build --wait
# Passo a passo completo em docs/DEPLOY.md.
services:
  php:
    image: ${IMAGES_PREFIX:-}hubtcc-php-prod
    build:
      context: ./api
      target: frankenphp_prod
      # O build de produção também compila o frontend React (pasta web/)
      additional_contexts:
        web: ./web
    environment:
      APP_ENV: prod
      # Domínio público: o Caddy emite o certificado HTTPS (Let's Encrypt) sozinho
      SERVER_NAME: "${SERVER_NAME:?Defina SERVER_NAME no .env.prod, por exemplo tcc.suafaculdade.edu.br}"
      DEFAULT_URI: https://${SERVER_NAME}
      APP_SECRET: ${APP_SECRET:?Defina APP_SECRET no .env.prod}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?Defina JWT_PASSPHRASE no .env.prod}
      APP_FRONTEND_URL: https://${SERVER_NAME}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-hubtcc <nao-responda@localhost>}
    volumes:
      # Chaves do JWT geradas na primeira subida; o volume evita derrubar todas
      # as sessões a cada atualização da imagem
      - jwt_keys:/app/config/jwt

  worker:
    # Mesma imagem da API, construída pelo serviço php
    image: ${IMAGES_PREFIX:-}hubtcc-php-prod
    pull_policy: never
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?Defina APP_SECRET no .env.prod}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?Defina JWT_PASSPHRASE no .env.prod}
      APP_FRONTEND_URL: https://${SERVER_NAME}
      # SMTP do provedor (ex.: smtp://usuario:senha@smtp.brevo.com:587). Sem ele, os e-mails são descartados
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-hubtcc <nao-responda@localhost>}
    volumes:
      - jwt_keys:/app/config/jwt

  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.prod}

volumes:
  jwt_keys:
