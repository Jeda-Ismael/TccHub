# Ambiente de desenvolvimento (carregado automaticamente pelo `docker compose`)
services:
  php:
    build:
      context: ./api
      target: frankenphp_dev
    volumes:
      - ./api:/app
      - ./api/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./api/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # var/ e vendor/ ficam em volumes do Docker, fora da pasta do projeto: no
      # Windows e no Mac ler milhares de arquivos pelo bind mount é muito lento
      # (o primeiro request chegava a estourar o limite de 30 s do PHP)
      - /app/var
      - api_vendor:/app/vendor
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      # https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      APP_ENV: "${APP_ENV:-dev}"
    healthcheck:
      # Na primeira subida o entrypoint roda `composer install`, que pode
      # levar vários minutos numa pasta do Windows
      start_period: 10m
    extra_hosts:
      # Garante que host.docker.internal exista no Linux (Xdebug)
      - host.docker.internal:host-gateway
    tty: true
    # Roda o script de inicialização direto da pasta do projeto (mudanças nele
    # valem sem rebuild). Chamado via sh: não depende da permissão de execução,
    # que se perde em clones no Windows.
    entrypoint: ["sh", "/app/frankenphp/docker-entrypoint.sh"]
    command: ["frankenphp", "run", "--config", "/etc/frankenphp/Caddyfile", "--watch"]

  database:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  web:
    image: node:22-alpine
    # Volta sozinho quando o Docker Desktop inicia (junto com o Windows)
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      # O frontend chama /api no próprio Vite, que repassa para o container php
      VITE_API_URL: /api
      API_PROXY_TARGET: http://php
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - php

  mailer:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  adminer:
    image: adminer
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - database

volumes:
  api_vendor:
  web_node_modules:
