# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

# Toda a API fica sob /api (o frontend e a API dividem o mesmo domínio)
controllers:
    resource: routing.controllers
    prefix: /api

# Rotas atendidas pelo firewall (config/packages/security.yaml), sem controller
api_auth_login:
    path: /api/auth/login
    methods: [POST]

api_auth_refresh:
    path: /api/auth/refresh
    methods: [POST]

api_auth_logout:
    path: /api/auth/logout
    methods: [POST]

# Documentação da API: Swagger UI e o OpenAPI em JSON (config/packages/nelmio_api_doc.yaml)
api_docs_ui:
    path: /api/docs
    methods: [GET]
    defaults: { _controller: nelmio_api_doc.controller.swagger_ui }

api_docs_json:
    path: /api/docs.json
    methods: [GET]
    defaults: { _controller: nelmio_api_doc.controller.swagger }
