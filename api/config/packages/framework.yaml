# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # A API é stateless (JWT): sem sessão PHP
    session: false

    rate_limiter:
        # Cadastro público: no máximo 5 contas novas a cada 10 minutos por IP
        register:
            policy: sliding_window
            limit: 5
            interval: '10 minutes'

when@test:
    framework:
        test: true
