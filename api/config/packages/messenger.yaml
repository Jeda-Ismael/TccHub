# E-mails saem por uma fila (docs/ARQUITETURA.md §9): o Mailer põe cada e-mail
# na tabela messenger_messages, na mesma transação da ação que gerou o aviso,
# e o serviço worker envia. Se a ação falhar, nenhum e-mail sai.
framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 60000
                    multiplier: 3
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
