name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Testes e cobertura mínima de 85% (Vitest)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  api:
    name: API (Symfony)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/bake-action@v6
        with:
          source: .
          pull: true
          load: true
          files: |
            compose.yaml
            compose.override.yaml
          targets: php
          set: |
            *.cache-from=type=gha,scope=php
            *.cache-to=type=gha,scope=php,mode=max

      - name: Sobe a API e o banco
        run: docker compose up php database --wait --no-build

      - name: Health check
        # -k: certificado local autoassinado do Caddy
        run: curl -fsSk https://localhost/api/health

      - name: Estilo (PHP-CS-Fixer)
        run: make cs

      - name: Análise estática (PHPStan)
        run: make phpstan

      - name: Testes e cobertura mínima de 85%
        run: make test-coverage

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

  prod:
    name: Produção (imagem + smoke test)
    runs-on: ubuntu-latest
    env:
      SERVER_NAME: localhost
      APP_SECRET: ci-secret
      JWT_PASSPHRASE: ci-passphrase
      POSTGRES_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Constrói e sobe a versão de produção
        run: docker compose -f compose.yaml -f compose.prod.yaml up --detach --build --wait

      - name: API responde
        run: curl -fsSk https://localhost/api/health

      - name: Frontend servido pelo mesmo domínio (inclusive rotas do SPA)
        run: |
          curl -fsSk https://localhost/ | grep -q 'id="root"'
          curl -fsSk https://localhost/coordination/users | grep -q 'id="root"'

      - name: Primeiro usuário e login
        run: |
          docker compose -f compose.yaml -f compose.prod.yaml exec -T php bin/console app:user:create "Coordenação CI" ci@hubtcc.dev --role=COORDINATION --password=senha-forte
          curl -fsSk -X POST https://localhost/api/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@hubtcc.dev","password":"senha-forte"}' | grep -q accessToken

      # Os valores vêm do env do job; o .env.prod vazio só satisfaz o --env-file do Makefile
      - name: Backup (make prod-backup)
        run: |
          touch .env.prod
          make prod-backup
          gunzip -c backups/banco-*.sql.gz | grep -q 'CREATE TABLE public.tccs'
          tar tzf backups/pdfs-*.tar.gz > /dev/null

      - name: Logs em caso de falha
        if: failure()
        run: docker compose -f compose.yaml -f compose.prod.yaml logs
