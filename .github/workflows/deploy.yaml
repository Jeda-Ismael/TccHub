name: Deploy

# Atualiza o servidor de produção depois que a CI passa na main (ou quando
# disparado à mão em Actions > Deploy > Run workflow).
#
# Fica desligado até configurar, em Settings > Secrets and variables > Actions:
#   Variables: DEPLOY_HOST (ex.: tcc.suafaculdade.edu.br), DEPLOY_USER (ex.: deploy),
#              DEPLOY_PATH (ex.: /home/deploy/TccHub)
#   Secrets:   DEPLOY_SSH_KEY (chave privada com acesso ao servidor),
#              DEPLOY_KNOWN_HOSTS (saída de: ssh-keyscan seu-servidor)
# Passo a passo em docs/DEPLOY.md, seção "Deploy automático".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Atualizar o servidor
    runs-on: ubuntu-latest
    if: >-
      vars.DEPLOY_HOST != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    environment: production
    steps:
      - name: Chave SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Backup antes de tudo; depois só avança a main (nunca sobrescreve mudanças locais)
      - name: Atualizar e subir
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DIR: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" bash -s -- "$DIR" <<'SCRIPT'
          set -euo pipefail
          cd "$1"
          make prod-backup
          git fetch origin main
          git checkout --quiet main
          git merge --ff-only origin/main
          make prod-up
          SCRIPT

      - name: Conferir se está no ar
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "https://$HOST/api/health"
